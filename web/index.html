<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agenda com calendário duplo: rotina fixa e tarefas extras, com chat de comandos.">
  <meta name="theme-color" content="#16161D">

  <!-- iPhone/iPad: abre em tela cheia quando adicionado à Tela de Início -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rotina">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">
  <title>Adaptive Routine</title>
  <style>
    html, body { margin: 0; background: #16161D; }
    /* Tela de carregamento: aparece na hora, enquanto o motor do Flutter inicia. */
    #splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #16161D; color: #9A9AB0;
      font: 14px -apple-system, system-ui, sans-serif;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="">
    <div>Carregando…</div>
  </div>

  <script>
    // Some com a tela de carregamento quando o app desenha o primeiro quadro.
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
